; ============================================================================
; ReasonKey - beginner configuration guide
; ============================================================================
;
; WHAT THIS FILE DOES
; Each [Preset...] section connects one shortcut to a complete Codex model and
; reasoning-effort selection plus a ChatGPT Chat effort. ReasonKey applies the
; values for whichever composer is currently active.
;
; If this file is named presets.ini, it is your active configuration.
; If it is named presets-reference.ini, it is an always-current example file.
; Edit presets.ini, not presets-reference.ini.
;
; HOW TO CHANGE A PRESET
; 1. Change only the text after an equals sign (=).
; 2. Do not add quotation marks around values.
; 3. Save the file (File > Save, or press Ctrl+S).
; 4. Find the black key icon with green-and-white chevrons near the clock.
;    If it is hidden, click the ^ arrow to show hidden icons.
; 5. Right-click the key icon and choose Reload.
; 6. Activate a Codex or ChatGPT Chat composer and test your shortcut.
;
; GENERAL SETTINGS
; PresetCount tells the utility how many numbered sections to read.
; Allowed range: 1 to 20.
; With PresetCount=4, the utility reads [Preset1] through [Preset4].
; To add a preset, copy an entire [Preset...] block, give it the next number
; (for example [Preset5]), and increase PresetCount to include it.
; To remove a preset, lower PresetCount and optionally delete unused blocks.
; Keep section numbers consecutive: [Preset1], [Preset2], [Preset3], and so on.
;
; SETTINGS INSIDE EACH PRESET
; Hotkey = the keyboard shortcut. Every preset should use a unique hotkey.
; Name   = any friendly description shown in the tray menu and status message.
; Model  = Luna, Terra, or Sol.
; Effort = Light, Medium, High, Extra High, Max, or Ultra.
; ChatEffort = Instant, Medium, High, or Pro. This is used in ChatGPT Chat.
; Current ChatGPT versions display these as Light, Medium, High, and Max.
; The Instant and Pro names stay here so existing presets also work across
; older ChatGPT picker layouts.
;
; Availability depends on the active composer, selected model, and your OpenAI
; account. If the composer does not offer a requested choice, selection fails
; and the reason will be written to ReasonKey.log.
;
; The Codex Model and Effort above stay independent from ChatEffort. With the
; defaults, F16-F19 select Light, Medium, High, and Max in current ChatGPT Chat
; while keeping Luna High, Sol Light, Sol Extra High, and Sol Max in Codex. In
; ChatGPT Chat, the utility selects 5.6 Sol plus the mapped ChatEffort. Plan
; availability still applies.
;
; HOTKEY SYNTAX
; A plain key can be written directly: F16, F17, F18, F19, F6, or 1.
; Modifier symbols can be placed before a key:
;   ^  means Ctrl
;   !  means Alt
;   +  means Shift
;   #  means the Windows key (some Windows shortcuts are reserved)
;
; Examples:
;   Hotkey=F16    means F16
;   Hotkey=^!1    means Ctrl+Alt+1
;   Hotkey=+F6    means Shift+F6
;   Hotkey=^+2    means Ctrl+Shift+2
;
; Many standard keyboards do not have physical F16-F19 keys. In that case,
; replace the defaults with shortcuts such as ^!1, ^!2, ^!3, and ^!4.
;
; These shortcuts work only while the Codex/ChatGPT desktop window is active.
; They do not take
; over the same keys in other applications.
;
; ACCEPTED ALIASES
; Effort=Low is treated as Light.
; Effort=xhigh is treated as Extra High.
;
; TROUBLESHOOTING
; - Make sure PresetCount includes every numbered preset you want to use.
; - Make sure every Hotkey is unique and every required value is present.
; - Use only the Model and Effort values listed above.
; - Use only Instant, Medium, High, or Pro for ChatEffort.
; - After saving, always choose Reload from the tray menu.
; - To inspect errors, right-click the tray icon and choose Open log.
; - If all configured presets are invalid, the built-in F16-F19 defaults are
;   loaded so the utility can still start.

[General]
PresetCount=4

[Preset1]
Hotkey=F16
Name=Luna High
Model=Luna
Effort=High
ChatEffort=Instant

[Preset2]
Hotkey=F17
Name=Sol Light
Model=Sol
Effort=Light
ChatEffort=Medium

[Preset3]
Hotkey=F18
Name=Sol Extra High
Model=Sol
Effort=Extra High
ChatEffort=High

[Preset4]
Hotkey=F19
Name=Sol Max
Model=Sol
Effort=Max
ChatEffort=Pro
